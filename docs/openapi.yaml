openapi: 3.0.3
info:
  title: AI Fashion Sales Assistant API
  version: 0.1.0
  description: >
    Backend for the AI Fashion Sales Assistant. Admin endpoints use a Bearer JWT
    (`POST /api/auth/login`). Internal endpoints accept `x-internal-token`
    (`API_INTERNAL_TOKEN`) or an admin JWT.
servers:
  - url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    internalToken: { type: apiKey, in: header, name: x-internal-token }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    Product:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        category: { type: string }
        price: { type: integer }
        gender: { type: string }
        sizes: { type: array, items: { type: string } }
        colors: { type: array, items: { type: string } }
        stock: { type: integer }
        discount: { type: number }
        images: { type: array, items: { type: string } }
    ChatResult:
      type: object
      properties:
        reply: { type: string }
        intent: { type: string }
        sentiment: { type: string }
        state: { type: string }
        products: { type: array, items: { $ref: '#/components/schemas/Product' } }
        orderId: { type: string, nullable: true }
        conversationId: { type: string }
paths:
  /healthz:
    get:
      summary: Health check
      responses: { '200': { description: OK } }
  /api/auth/login:
    post:
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: token + admin }
        '401': { description: invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/me:
    get:
      summary: Current admin
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: admin } }
  /api/products:
    get:
      summary: List / filter products
      parameters:
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: gender, schema: { type: string } }
        - { in: query, name: color, schema: { type: string } }
        - { in: query, name: maxPrice, schema: { type: integer } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: trending, schema: { type: boolean } }
      responses: { '200': { description: 'data[] + meta' } }
    post:
      summary: Create product
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: created }, '400': { description: validation error } }
  /api/products/{id}:
    get: { summary: Get product, responses: { '200': { description: product }, '404': { description: not found } } }
    patch: { summary: Update product, security: [{ bearerAuth: [] }], responses: { '200': { description: updated } } }
    delete: { summary: Delete product, security: [{ bearerAuth: [] }], responses: { '200': { description: deleted } } }
  /api/customers:
    get: { summary: List customers, security: [{ bearerAuth: [] }], responses: { '200': { description: 'data list + meta' } } }
  /api/customers/{id}:
    get: { summary: Customer + orders + conversations, security: [{ bearerAuth: [] }], responses: { '200': { description: customer } } }
    patch: { summary: Update customer, security: [{ bearerAuth: [] }], responses: { '200': { description: updated } } }
  /api/orders:
    get: { summary: List orders, security: [{ bearerAuth: [] }], responses: { '200': { description: 'data list + meta' } } }
    post: { summary: Create order, security: [{ internalToken: [] }], responses: { '201': { description: created }, '409': { description: out of stock } } }
  /api/orders/{id}:
    get: { summary: Get order, security: [{ bearerAuth: [] }], responses: { '200': { description: order } } }
    patch: { summary: Update status / payment / tracking, security: [{ bearerAuth: [] }], responses: { '200': { description: updated } } }
  /api/conversations:
    get: { summary: List conversations, security: [{ bearerAuth: [] }], responses: { '200': { description: 'data list + meta' } } }
  /api/conversations/{id}:
    get: { summary: Conversation + message timeline, security: [{ bearerAuth: [] }], responses: { '200': { description: conversation } } }
  /api/canned-responses:
    get: { summary: List canned responses, security: [{ bearerAuth: [] }], responses: { '200': { description: 'data list' } } }
    post: { summary: Create canned response, security: [{ bearerAuth: [] }], responses: { '201': { description: created } } }
  /api/canned-responses/{id}:
    patch: { summary: Update, security: [{ bearerAuth: [] }], responses: { '200': { description: updated } } }
    delete: { summary: Delete, security: [{ bearerAuth: [] }], responses: { '200': { description: deleted } } }
  /api/export/{entity}/{format}:
    get:
      summary: Export data
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: entity, required: true, schema: { type: string, enum: [products, customers, orders, conversations] } }
        - { in: path, name: format, required: true, schema: { type: string, enum: [csv, json] } }
      responses: { '200': { description: file download } }
  /api/chat/ingest:
    post:
      summary: Run the conversation pipeline for one message
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, senderId]
              properties:
                channel: { type: string, enum: [instagram, whatsapp, simulator] }
                senderId: { type: string }
                senderName: { type: string }
                text: { type: string }
                attachments: { type: array, items: { type: object } }
                send: { type: boolean, default: false }
      responses:
        '200':
          description: pipeline result
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ChatResult' } } } } }
  /api/chat/stream:
    get:
      summary: Server-Sent Events feed of outbound messages
      parameters:
        - { in: query, name: channel, schema: { type: string } }
      responses: { '200': { description: 'text/event-stream' } }
  /api/channels/{channel}/send:
    post:
      summary: Dispatch a message on a channel (used by n8n)
      security: [{ internalToken: [] }]
      parameters:
        - { in: path, name: channel, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string }
                text: { type: string }
                images: { type: array, items: { type: string } }
      responses: { '200': { description: delivery result } }
  /api/webhooks/{channel}:
    get:
      summary: Meta webhook verification handshake
      parameters:
        - { in: path, name: channel, required: true, schema: { type: string, enum: [instagram, whatsapp] } }
        - { in: query, name: 'hub.mode', schema: { type: string } }
        - { in: query, name: 'hub.verify_token', schema: { type: string } }
        - { in: query, name: 'hub.challenge', schema: { type: string } }
      responses:
        '200': { description: echoes hub.challenge }
        '403': { description: verification failed }
    post:
      summary: Receive channel events
      description: >
        Validates `X-Hub-Signature-256` when an app secret is configured, acks 200 immediately,
        then either forwards to n8n (`ORCHESTRATION_MODE=n8n`) or runs the pipeline directly.
      parameters:
        - { in: path, name: channel, required: true, schema: { type: string } }
      responses: { '200': { description: acknowledged } }
