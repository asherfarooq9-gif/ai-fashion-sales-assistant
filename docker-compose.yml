services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/ai-fashion-sales-assistant
      WEB_ORIGIN: http://localhost:8080
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@brand.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:-change-me-internal}
      ORCHESTRATION_MODE: ${ORCHESTRATION_MODE:-direct}
      N8N_INBOUND_WEBHOOK_URL: ${N8N_INBOUND_WEBHOOK_URL:-http://n8n:5678/webhook/inbound}
      CHANNEL_TRANSPORT: ${CHANNEL_TRANSPORT:-stub}
    ports:
      - '5000:5000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-change-me-n8n}
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Karachi
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - '5678:5678'

volumes:
  mongo_data:
  n8n_data:
